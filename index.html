<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدكتورة ميس علي السيد - أخصائية تخدير</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d7377 0%, #14919b 50%, #0a5c5f 100%);
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      padding: 36px 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 8px; height: 100%;
      background: #0d7377;
    }
    .name {
      font-size: 1.45rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .specialty {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0d7377;
      margin-bottom: 20px;
    }
    .divider {
      height: 1px;
      background: #e0e0e0;
      margin: 0 10px 22px;
    }
    .phone {
      font-size: 1.05rem;
      color: #333;
      margin-bottom: 10px;
      direction: ltr;
      unicode-bidi: isolate;
    }
    .location {
      font-size: 0.95rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="name">الدكتورة ميس علي السيد</div>
    <div class="specialty">أخصائية تخدير</div>
    <div class="divider"></div>
    <div class="phone">+963 939 169 012</div>
    <div class="location">مشفى الرازي</div>
  </div>
</body>
</html>
